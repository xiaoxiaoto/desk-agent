[package]
name = "desk-agent"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[lib]
name = "desk_agent"
path = "src/lib.rs"

[[bin]]
name = "desk-agent"
path = "src/main.rs"

[[bin]]
name = "desk-agent-cli"
path = "src/interfaces/cli/main.rs"

[[bin]]
name = "desk-agent-desktop"
path = "src/interfaces/desktop/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "io-util", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
